[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tona-bot"
version = "12.0.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "Flask==2.2.3",
    "requests==2.31.0",
    "numpy==1.23.5",
    "python-dotenv==0.21.0",
    "gunicorn==20.1.0",
]
